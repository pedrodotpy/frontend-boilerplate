services:
  frontend:
    build: .
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - ../django-boilerplate:/django-boilerplate:ro
    ports:
      - "5173:5173"
    env_file:
      - path: .env
        required: false
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      OPENAPI_SCHEMA_PATH: ${OPENAPI_SCHEMA_PATH:-/django-boilerplate/schema.yml}

volumes:
  frontend_node_modules:
